name: Update profile dashboard

on:
  schedule:
    - cron: "17 */12 * * *"      # every 12 hours, off the hour to avoid peak load
  workflow_dispatch:              # "Run workflow" button
  push:
    branches: [main]
    paths:                        # only re-run when the generator or config changes,
      - "profile.config.json"     # never on the bot's own asset commits (no loops)
      - "scripts/**"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write                 # needed to commit the regenerated assets, nothing else

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate assets
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}      # built in, nothing to create
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}    # optional, see SETUP.md
        run: python scripts/build_profile.py

      - name: Check assets
        run: python scripts/check_assets.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(profile): refresh dashboard [skip ci]"
            git push
          fi
